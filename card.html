      if (openWhy.has(a.address)) { const ol = el('ol', 'why'); for (const w of L.why) ol.append(el('li', null, w)); box.append(ol); }
    }
    return box;
  }
  function render() {
    const L = T[lang], app = $('#app');
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-lang-btn]').forEach((b) => b.classList.toggle('active', b.dataset.langBtn === lang));
    app.textContent = '';
    if (state === 'loading') { app.append(el('p', 'sub', L.loading)); }
    else if (state === 'empty') {
      app.append(el('div', 'status', L.emptyHead));
      const f = el('form', 'btns'), i = el('input', 'inp'), b = el('button', 'btn main', L.go);
      i.placeholder = L.emptyPh; i.maxLength = 40; i.autocomplete = 'off'; i.spellcheck = false; b.type = 'submit'; i.style.flex = '1';
      f.append(i, b); f.addEventListener('submit', (e) => { e.preventDefault(); const v = i.value.trim().replace(/^@/, ''); if (/^[A-Za-z0-9_]{3,40}$/.test(v)) location.href = '/@' + v.toLowerCase(); });
      app.append(f);
    }
    else if (state === 'down') { app.append(el('div', 'status bad', '⚠'), el('p', 'sub', L.down + (NAME || ''))); }
    else if (state === 'none') { document.title = L.title(NAME); app.append(el('div', 'status bad', L.none(NAME)), el('div', 'box bad', L.noneNote)); }
    else if (data && data.official) {
      document.title = L.title(data.name);
      app.append(el('div', 'status live', L.official), el('p', 'sub', L.officialSub));
      const b = el('div', 'box');
      const kv = (k, v, href) => { const d = el('div', 'kv'); d.append(el('span', 'k', k + (lang === 'zh' ? '：' : ': '))); if (href) { const a = el('a', null, v); a.href = href; a.target = '_blank'; a.rel = 'noopener'; d.append(a); } else d.append(el('span', null, v)); return d; };
      b.append(kv(L.oSite, data.site, data.site));
      if (data.bot) b.append(kv(L.oBot, data.bot, 'https://t.me/' + data.bot.replace(/^@/, '')));
      if (data.github) b.append(kv(L.oGit, data.github, data.github));
      app.append(b, el('div', 'box warn', L.oPay), el('p', 'sub', L.oToken));
    }
    else if (data) {
      const c = data, n = c.name;
      document.title = L.title(n);
      $('#ttl').textContent = '0x000000000 — @' + n;
      // 撤销的、过期的：只说状态，不列地址、不给核对框（平台也不再给地址 —— 我们不替它担保了）
      if (c.status === 'revoked' || c.status === 'expired') app.append(el('div', 'status bad', c.status === 'revoked' ? L.revoked(c) : L.expired(c)), el('div', 'box bad', c.status === 'revoked' ? L.revokedNote : L.expiredNote));
      else {
        app.append(el('div', 'status ' + (c.status === 'live' ? 'live' : c.status === 'notice' ? 'notice' : 'bad'), c.status === 'live' ? L.live(c) : c.status === 'notice' ? L.notice(c) : L.expired(c)));
        if (c.status === 'notice') app.append(el('div', 'box warn', L.noticeNote));
        app.append(el('p', 'sub', L.what.replace('{n}', n)));
        app.append(el('div', 'box warn', L.copyFromHere));
        for (const a of (c.addresses || []).filter((x) => x.state !== 'adding')) app.append(addrBox(a));
        const adds = (c.addresses || []).filter((x) => x.state === 'adding');
        if (adds.length || (c.pending || []).length) {
          const pb = el('div', 'box warn'); pb.append(el('div', 'row-h', L.pendingHead));
          for (const a of adds) pb.append(el('div', 'kv', L.adding(a)));
          for (const p of c.pending || []) pb.append(el('div', 'kv', L.pend(p)));
          app.append(pb);
        }
        const vb = el('div', 'box'); vb.append(el('div', 'row-h', L.verifyHead));
        const f = el('form'), inp = el('input', 'inp'), go = el('button', 'btn main', L.verifyBtn), res = el('div', 'res');
        inp.placeholder = L.verifyPh; inp.autocomplete = 'off'; inp.spellcheck = false; inp.value = lastCheck; go.type = 'submit';
        const run = () => { lastCheck = inp.value; if (!inp.value.trim()) { res.textContent = ''; return; } const [k, msg] = verdict(inp.value); res.className = 'res ' + k; res.textContent = msg; };
        f.addEventListener('submit', (e) => { e.preventDefault(); run(); });
        const row = el('div', 'btns'); inp.style.flex = '1'; row.append(inp, go); f.append(row, res, el('div', 'small', L.vfLocal));
        vb.append(f); app.append(vb);
        if (lastCheck) run();
        const info = el('div', 'box');
        const kv = (k, v, href) => { const d = el('div', 'kv'); d.append(el('span', 'k', k + (lang === 'zh' ? '：' : ': '))); if (href) { const a = el('a', null, v); a.href = href; a.target = '_blank'; a.rel = 'noopener nofollow'; d.append(a); } else d.append(el('span', null, v)); return d; };
        if (c.domain) info.append(kv(L.site, c.domain, 'https://' + c.domain));
        if (c.x) info.append(kv(L.x, '@' + c.x.handle, 'https://x.com/' + c.x.handle));
        if (c.tg) info.append(kv(L.tg, 't.me/' + c.tg.channel, 'https://t.me/' + c.tg.channel));
        if (c.since) info.append(kv(L.since, utc(c.since).slice(0, 10)));
        if (c.expiresAt) info.append(kv(L.until, utc(c.expiresAt).slice(0, 10)));
        app.append(info);
        if (c.ref && /^https:\/\/0x000000000\.com\/\?ref=[2-9A-HJ-NP-Z]{6}$/.test(c.ref)) { const rb = el('div', 'box'); rb.append(el('div', 'row-h', L.refHead)); const a = el('a', null, L.refLink.replace('{n}', n)); a.href = c.ref; rb.append(a); app.append(rb); }
        if (c.tier === 'yellow' && c.status === 'live') {
          const snip = '<a href="https://0x000000000.com/@' + n + '"><img src="https://0x000000000.com/api/badge/' + n + '.svg" alt="@' + n + ' verified by 0x000000000"></a>';
          const bb = el('div', 'box'); bb.append(el('div', 'row-h', L.badgeHead), el('code', 'snip', snip));
          const sb = el('button', 'btn', L.copySnip); sb.type = 'button'; sb.addEventListener('click', () => copy(snip, sb)); bb.append(el('div', 'btns')); bb.lastChild.append(sb); app.append(bb);
        }
      }
      const nw = el('p', 'small', L.news + ' ');
      const src = el('a', null, L.newsSrc); src.href = 'https://beincrypto.com/ethereum-holder-address-poisoning-attack/'; src.target = '_blank'; src.rel = 'noopener nofollow'; nw.append(src);
      app.append(nw);
    }
    const foot = $('#foot'); foot.textContent = '';
    foot.append(el('div', 'never', L.never), el('div', 'never', L.never2), el('div', null, L.officialUrl));
    const nav = el('div');
    L.links.forEach(([h, t], i) => { if (i) nav.append(' · '); const a = el('a', null, t); a.href = h; nav.append(a); });
    foot.append(nav);
  }
  document.querySelectorAll('[data-lang-btn]').forEach((b) => b.addEventListener('click', () => { lang = b.dataset.langBtn; try { localStorage.setItem(LANG_KEY, lang); } catch (e) {} render(); }));
  const utcEl = $('#utcClock');
  const tickUtc = () => { const d = new Date(), p = (x) => String(x).padStart(2, '0'); utcEl.textContent = d.getUTCFullYear() + '-' + p(d.getUTCMonth() + 1) + '-' + p(d.getUTCDate()) + ' ' + p(d.getUTCHours()) + ':' + p(d.getUTCMinutes()) + ':' + p(d.getUTCSeconds()) + ' UTC'; };
  tickUtc(); setInterval(tickUtc, 1000);
  render();
  if (NAME) (async () => {
    try {
      const r = await fetch('/api/card/' + encodeURIComponent(NAME), { cache: 'no-store' });
      if (r.status === 404) state = 'none';
      else if (r.ok) { const j = await r.json(); if (j && typeof j.name === 'string' && (j.official || Array.isArray(j.addresses) || j.status === 'revoked' || j.status === 'expired')) { data = j; state = 'ok'; } else state = 'down'; }
      else state = 'down';
    } catch (e) { state = 'down'; }
    render();
  })();
})();
</script>
