name: Private-key leak check
# The name is English only: GitHub badges size the label for Latin letters and cover the last Chinese characters with "passing".
# 名字只用英文：GitHub 徽章按英文字母算宽度，中文最后一两个字会被「passing」盖住（20260924 实测，原来的中文徽章也是这样）。中文名写在 README.zh-CN.md 徽章旁边。
# Runs on every new version (push), and again every Monday so the check does not stop when nobody pushes.
# 每次有新版本（推送）都跑；每周一再跑一次，免得「没人推送就没人查」。
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'
permissions:
  contents: read
jobs:
  noleak:
    # Pinned to Ubuntu 24.04: from 2026-10-19 GitHub moves ubuntu-latest to Ubuntu 26.04, and a new system must not turn this check red by itself. · 钉在 Ubuntu 24.04：GitHub 从 2026-10-19 起把 ubuntu-latest 换成 Ubuntu 26.04，换系统不能自己把这个检查弄红。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 - pinned to the full commit, a tag can move · 钉在完整提交号上，标签可以被挪走
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Rebuild from src/ - must equal the published file byte for byte · 用 src/ 里的源码重新构建一遍，必须跟公开的文件逐字节相同
        run: |
          node src/build-single.mjs src /tmp/rebuilt.html
          sha256sum -c SHA256SUMS
          cmp /tmp/rebuilt.html 0x000000000.html
          echo "Rebuilt from source: identical to the published file · 从源码重新构建出来的文件，跟公开的这份一模一样"
      - name: Rebuild the vanity contract and token address pages from src/ - must equal the published files byte for byte · 用 src/ 重新拼合约靓号页、发币地址定制页，必须跟公开的两个文件逐字节相同
        run: |
          node src/build-c2.mjs src /tmp/c2
          cmp /tmp/c2/0x000000000-contract.html 0x000000000-contract.html
          cmp /tmp/c2/0x000000000-token.html 0x000000000-token.html
          echo "Rebuilt from source: both pages identical to the published files · 从源码重新拼出来的两页，跟公开的一模一样"
      - name: Rebuild the Free Generator page from src/ - must equal the published file byte for byte · 用 src/ 重新拼免费生成页，必须跟公开的文件逐字节相同
        run: |
          node src/build-free.mjs src /tmp/fg
          cmp /tmp/fg/0x000000000-free.html 0x000000000-free.html
          echo "Rebuilt from source: identical to the published file · 从源码重新拼出来的免费生成页，跟公开的一模一样"
      - name: Security regression - the attacks four outside reviews (2026-11-17/18) reproduced on the listed entry points must stay blocked, normal cases must still pass (see test/secfix.cjs for the exact list) · 安全回归：四轮外部安全检查（2026-11-17/18）在列出的入口上复现过的招数必须拦得住，正常的照样能过（具体哪些见 test/secfix.cjs）
        run: node test/secfix.cjs src wp.html ppt.html README.md README.zh-CN.md
      - name: Install a real browser · 装真浏览器
        working-directory: test
        run: |
          npm ci --no-audit --no-fund   # exact versions and hashes from package-lock.json · 版本和哈希都按 package-lock.json
          npx playwright install --with-deps chromium
      - name: Walk all 6 steps in a real browser and check every request the page sends · 用真浏览器走完 6 步，逐个核对页面发出去的每一个请求
        working-directory: test
        run: node noleak.cjs ../0x000000000.html ./mock-platform.mjs ./node_modules
      - name: Narrow phones (320 px) - on the site and as the downloaded file, in all three languages, nothing sticks out sideways · 320 宽的手机：网站上、下载下来，三种语言，没有东西横着多出来
        working-directory: test
        run: node narrow.cjs ../0x000000000.html ./mock-platform.mjs
      - name: Free Generator - generate real addresses in a real browser, open each wallet file, and count every request the page sends (must be none) · 免费生成页：真浏览器真的生成几个地址，打开每个钱包文件核对，数页面发出去的每一个请求（必须是 0 个）
        working-directory: test
        run: node noleak-free.cjs ../0x000000000-free.html ./node_modules
